<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#fafaf8" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/favicon.png" type="image/png" />
<title>Pineart</title>
<script>
  // Theme is applied before first paint, from localStorage rather than from the
  // settings API: waiting for a fetch would guarantee a flash of the wrong theme
  // on every load. The API remains the source of truth and overwrites this cache
  // once settings arrive.
  (function () {
    try {
      var stored = localStorage.getItem("artboard.theme") || "system";
      var dark =
        stored === "dark" ||
        (stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      var accent = localStorage.getItem("artboard.accent");
      if (accent) document.documentElement.style.setProperty("--color-accent", accent);
    } catch (e) {
      document.documentElement.dataset.theme = "light";
    }
  })();
</script>
</head>
<body>
<aside class="sidebar">
  <nav class="views" id="topNav">
    <button data-view="boards" data-sub="unorganized" title="Feed" aria-label="Feed"></button>
    <button data-view="boards" data-sub="organized" class="active" title="Boards" aria-label="Boards"></button>
    <button data-view="feed" hidden title="Discover" aria-label="Discover"></button>
  </nav>
  <div class="sidebar-spacer"></div>
  <!-- Desktop-only by construction: `.sidebar` (and everything in it) is
       hidden entirely below 640px, same as the rest of this rail. Mobile has
       no equivalent entry point — dropping a file from a phone's picker onto
       a hidden sidebar isn't a workflow this needs to cover. -->
  <button class="icon-btn" id="addImagesBtn" title="Add images" aria-label="Add images"></button>
  <button class="icon-btn" id="settingsBtn" data-view="settings" title="Settings" aria-label="Settings"></button>
  <input type="file" id="uploadInput" accept="image/*" multiple hidden />
  <input type="file" id="folderInput" accept="image/*" multiple hidden webkitdirectory />
</aside>

<main id="app"></main>

<nav class="bottom-tabbar" id="bottomTabbar"></nav>

<div class="toast-stack" id="toastStack"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
